<!-- START - Скопируйте всё это в файл index.html в вашем репозитории --> <!doctype html> <html lang="ru"> <head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width,initial-scale=1" /> <title>Опрос — исполнительные функции</title> <!-- Google Fonts Jost --> <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet"> <!-- Chart.js CDN (v3.9.1) --> <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script> <style> :root{ --bg-block: #f0ede5; --block-text: #212121; --accent: #f395b6; --btn-text: #212121; --card-radius: 32px; --btn-radius: 16px; --container-max: 1140px; --jost: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; } html,body{ height:100%; margin:0; padding:0; font-family:var(--jost); background:#fff; color:var(--block-text) } .survey-wrap { max-width:var(--container-max); margin:24px auto; padding:24px; box-sizing:border-box; text-align:center; } .survey-inner { width:100%; } #surveyCard .survey-inner { background: var(--bg-block); border-radius: var(--card-radius); padding:28px; box-sizing:border-box; border: none; margin:0 auto; width:100%; max-width:var(--container-max); color:var(--block-text); } .survey-progress { color:var(--block-text); font-size:15px; margin-bottom:10px; text-align:center; } .progress-bar { height:8px; background: rgba(33,33,33,0.08); border-radius:999px; overflow:hidden; margin-bottom:12px; } .progress-bar__fill { height:100%; width:0%; background: linear-gradient(90deg,#f395b6 0%, #f5c657 100%); transition:width .25s ease; } #questionArea { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:6px; } .q-title { color:var(--block-text); font-size:20px; line-height:1.4; text-align:center; max-width:980px; margin:6px auto 0; padding:0 12px; } .options { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:6px; } .option{ display:flex; align-items:center; gap:10px; cursor:pointer; background: transparent; padding:10px 14px; border-radius:12px; border: 0; transition:transform .12s ease; min-width:180px; justify-content:center; flex-direction:column; text-align:center; } .radio-wrap{ width:56px; height:56px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; border:2px solid rgba(33,33,33,0.06); } .radio-dot{ width:22px; height:22px; border-radius:50%; background:transparent; transition:background .12s ease; } .option-label{ color:var(--block-text); font-size:14px; } input[type="radio"].real-radio { display:none; } .option.selected .radio-wrap { background: #fff; border-color: var(--accent); box-shadow:0 6px 20px rgba(243,149,182,0.12); } .option.selected .radio-dot { background: var(--accent); } .controls { display:flex; gap:12px; margin-top:18px; justify-content:center; } .btn { padding:10px 18px; border-radius:var(--btn-radius); border:0; cursor:pointer; font-family:var(--jost); font-weight:600; } .btn-primary { background: var(--accent); color: var(--btn-text); } .btn-ghost { background: transparent; color: var(--block-text); border:1px solid rgba(33,33,33,0.06); padding:10px 16px; border-radius:12px; } .btn:disabled { opacity:.6; cursor:not-allowed; } .results-text { text-align:left; margin:14px auto; max-width:var(--container-max); color:var(--block-text); font-size:15px; } .btn-download { background:#4CC4FC; color:#fff; border-radius:12px; padding:8px 12px; margin-right:8px; } .btn-restart { background:#f395b6; color:var(--btn-text); border-radius:12px; padding:8px 12px; } @media (max-width:720px){ .option { min-width:140px; } .radio-wrap{ width:48px; height:48px; } .radio-dot{ width:18px; height:18px; } } </style> </head> <body> <div class="survey-wrap" id="app"> <div id="surveyCard" class="survey-card"> <div class="survey-inner"> <div class="progress-bar"><div class="progress-bar__fill" id="progressFill"></div></div> <div id="progress" class="survey-progress"></div> <div id="questionArea"></div> <div class="controls"> <button id="prevBtn" class="btn btn-ghost">Назад</button> <button id="nextBtn" class="btn btn-primary">Далее</button> </div> </div> </div>

</div> <script> /* Весь JS — логика опроса, вопросы, навигация, вычисления, отрисовка */ (function(){ const STORAGE_KEY = 'ef_survey_answers_v1'; const SCALE_MIN = 1, SCALE_MAX = 4; const BLOCK_LABELS = [ 'Самоконтроль\n(тайм‑менеджмент)', 'Решение проблем\nи оперативная память', 'Самоограничение\n/ торможение', 'Самомотивация', 'Эмоц. регуляция' ]; const QUESTIONS = [ {id:1, block:1, text:'Прокрастинирую или откладываю выполнение дел до последней минуты.'}, {id:2, block:1, text:'Плохо ощущаю время.'}, {id:3, block:1, text:'Растрачиваю или неправильно распоряжаюсь своим временем.'}, {id:4, block:1, text:'Не готовлюсь вовремя к работе или взятым на себя задачам.'}, {id:5, block:1, text:'Не соблюдаю сроки выполнения заданий.'}, {id:6, block:1, text:'Не могу заранее планировать события или заранее готовиться к ним.'}, {id:7, block:1, text:'Забываю делать то, что должен делать.'}, {id:8, block:1, text:'Не могу достичь целей, которые я перед собой ставлю.'}, {id:9, block:1, text:'Опаздываю на работу или на запланированные встречи.'}, {id:10, block:1, text:'Не могу удержать в голове то, что мне нужно не забыть сделать.'}, {id:11, block:1, text:'Не могу делать дела, если нет точного дедлайна.'}, {id:12, block:1, text:'Мне трудно определить, сколько времени потребуется на то, чтобы что-то сделать или куда-то добраться.'}, {id:13, block:1, text:'Трудно мотивировать себя на начало работы.'}, {id:14, block:1, text:'Трудно мотивировать себя к тому, чтобы продолжать работу и довести ее до конца.'}, {id:15, block:1, text:'Не мотивирован на то, чтобы заранее готовиться к делам, которые должен сделать.'}, {id:16, block:1, text:'Мне трудно закончить одного дело перед тем, как начать новое.'}, {id:17, block:1, text:'Трудно сделать то, что я говорю себе сделать.'}, {id:18, block:1, text:'Не выполняю обещания или обязательства, которые я могу дать другим людям.'}, {id:19, block:1, text:'Отсутствие самодисциплины.'}, {id:20, block:1, text:'Трудно выполнять дела по их приоритету и ли важности; не могу правильно расставить приоритеты.'}, {id:21, block:1, text:'Сложно начать или продолжать делать необходимые дела.'}, {id:22, block:2, text:'Не так хорошо способен предвидеть будущие события, как другие.'}, {id:23, block:2, text:'Не могу вспомнить то, о чем ранее слышал или читал.'}, {id:24, block:2, text:'Трудно организовать/упорядочить свои мысли.'}, {id:25, block:2, text:'Когда мне показывают что-то сложное, я не могу удержать информацию в голове, чтобы повторить или сделать это правильно.'}, {id:26, block:2, text:'Трудно рассматривать различные варианты действий и оценивать их последствия.'}, {id:27, block:2, text:'Затрудняюсь сформулировать то, что хочу сказать.'}, {id:28, block:2, text:'Не могу придумать столько решений проблем, сколько это удается другим.'}, {id:29, block:2, text:'Путаюсь в словах, когда хочу что-то объяснить другим.'}, {id:30, block:2, text:'Мне трудно излагать свои мысли в письменном виде так же хорошо или быстро, как это делают другие.'}, {id:31, block:2, text:'Чувствую, что я не такой творческий или изобретательный, как другие люди с моим уровнем интеллекта.'}, {id:32, block:2, text:'При попытках достичь цели или выполнить задание я не могу придумать столько же способов действий, сколько другие.'}, {id:33, block:2, text:'Мне сложнее осваивать новые или сложные виды деятельности, чем другим людям.'}, {id:34, block:2, text:'Мне трудно рассказывать о каких-то вещах или событиях по порядку.'}, {id:35, block:2, text:'Не могу перейти к сути своих объяснений так же быстро, как другие.'}, {id:36, block:2, text:'Мне сложно выполнять действия в нужном порядке или последовательности.'}, {id:37, block:2, text:'Не способен "думать на ходу" или реагировать на неожиданные события так же эффективно, как другие.'}, {id:38, block:2, text:'Я медленнее, чем другие люди, решаю проблемы, с которыми сталкиваюсь в повседневной жизни.'}, {id:39, block:2, text:'Я легко отвлекаюсь на неважные в этот момент события или мысли, когда должен концентрироваться на чем-то другом.'}, {id:40, block:2, text:'Не могу осмыслять то, что я читаю, так хорошо, как должен; приходится перечитывать, чтобы понять, что это значит.'}, {id:41, block:2, text:'Не могу сфокусировать внимание на задаче или работе так же, как другие.'}, {id:42, block:2, text:'Меня легко сбить с толку, быстро чувствую, что запутался.'}, {id:43, block:2, text:'Неспособен поддерживать мое внимание на чтении, бумажной работе, лекциях или работе.'}, {id:44, block:2, text:'Тяжело перевести внимание на важные вещи с неважных, когда я занят ими.'}, {id:45, block:2, text:'Не могу обрабатывать информацию так же быстро или точно, как другие.'}, {id:46, block:3, text:'С трудом переношу ожидание, нетерпелив.'}, {id:47, block:3, text:'Принимаю решения импульсивно.'}, {id:48, block:3, text:'Не в состоянии сдерживать свои реакции на события и других людей.'}, {id:49, block:3, text:'Трудно остановиться и перестать делать что-то, когда нужно.'}, {id:50, block:3, text:'Мне трудно изменить свое поведение, когда мне дают понять, что оно неправильное.'}, {id:51, block:3, text:'Делаю импульсивные замечания другим.'}, {id:52, block:3, text:'Имею склонность совершать поступки, не задумываясь о последствиях.'}, {id:53, block:3, text:'Меняю свои планы в последнюю минуту по прихоти или внезапному порыву.'}, {id:54, block:3, text:'Не учитываю прошлые значимые события или прошлый личный опыт, прежде чем реагировать на ситуации (делаю, не подумав).'}, {id:55, block:3, text:'Не осознаю того, что говорю или делаю.'}, {id:56, block:3, text:'Мне трудно быть объективным в отношении вещей, которые меня касаются.'}, {id:57, block:3, text:'Трудно увидеть проблему или ситуацию с другой точки зрения.'}, {id:58, block:3, text:'Не обдумываю и не обсуждаю задачу с самим собой, прежде чем что-то сделать.'}, {id:59, block:3, text:'У меня проблемы с соблюдением правил в той или иной ситуации.'}, {id:60, block:3, text:'Вожу автомобиль намного быстрее, чем другие (превышаю скорости).'}, {id:61, block:3, text:'Низкая толерантность к фрустрирующим событиям.'}, {id:62, block:3, text:'Не могу регулировать свои эмоции так же хорошо, как другие люди.'}, {id:63, block:3, text:'Не думаю о будущем и о последствиях в будущем перед тем, как сделать что-то (недальновиден).'}, {id:64, block:3, text:'Делаю рискованные поступки чаще, чем обычно их делают другие.'}, {id:65, block:4, text:'Нередко стараюсь сделать все побыстрее и не делаю всего того, что я должен делать.'}, {id:66, block:4, text:'Могу оставлять работу или задачи раньше времени, если они скучные или трудные.'}, {id:67, block:4, text:'Не вкладываю в работу так много усилий, как должен, или столько же, сколько другие.'}, {id:68, block:4, text:'Другие говорят, что я ленив(а) или немотивирован(а).'}, {id:69, block:4, text:'Мне приходится полагаться на других, чтобы они помогли мне выполнить работу.'}, {id:70, block:4, text:'Не могу довести дело до конца, если оно не приносит мне немедленной отдачи.'}, {id:71, block:4, text:'Трудно противостоять желанию заняться чем-то веселым или интересным, когда я должен работать или делать что-то важное.'}, {id:72, block:4, text:'Качество или количество выполненной мной работы непостоянно.'}, {id:73, block:4, text:'Не способен(а) работать так же хорошо, как другие, без контроля или частых инструкций.'}, {id:74, block:4, text:'У меня нет такой же силы воли, как у других людей.'}, {id:75, block:4, text:'Не могу долго делать дела, которые не приносят быстрой отдачи, или с отложенным результатом, так же как другие люди.'}, {id:76, block:4, text:'Я продолжаю делать вещи, которые приносят мне немедленное удовлетворение, даже если в долгосрочной перспективе это мне вредит.'}, {id:77, block:5, text:'Легко злюсь или расстраиваюсь.'}, {id:78, block:5, text:'Слишком эмоционально реагирую.'}, {id:79, block:5, text:'Легко перевозбуждаюсь.'}, {id:80, block:5, text:'Не могу подавить проявление сильных негативных или позитивных эмоций.'}, {id:81, block:5, text:'С трудом успокаиваю себя, когда расстро x})); } catch(e){ console.warn('Не удалось сохранить прогресс', e); } } function updateProgressBar(){ const pct = Math.round((currentIndex / (QUESTIONS.length - 1)) * 100); progressFill.style.width = pct + '%'; } function renderQuestion(){ const q = QUESTIONS[currentIndex]; progressEl.textContent = 'Вопрос ' + (currentIndex + 1) + ' из ' + QUESTIONS.length + ' — ' + BLOCK_LABELS[q.block -1].replace('\\n',' '); updateProgressBar(); qArea.innerHTML = ''; const qTitle = document.createElement('div'); qTitle.className = 'q-title'; qTitle.innerHTML = '<strong>' + q.id + '. </strong>' + q.text; qArea.appendChild(qTitle); const optionsDiv = document.createElement('div'); optionsDiv.className = 'options'; const labelsText = ['Никогда/редко','Иногда','Часто','Очень часто']; for(let v=SCALE_MIN; v<=SCALE_MAX; v++){ const label = document.createElement('label'); label.className = 'option'; label.dataset.value = v; const input = document.createElement('input'); input.type = 'radio'; input.className = 'real-radio'; input.name = 'q' + q.id; input.value = v; const radioWrap = document.createElement('div'); radioWrap.className = 'radio-wrap'; const radioDot = document.createElement('div'); radioDot.className = 'radio-dot'; radioWrap.appendChild(radioDot); const labelText = document.createElement('div'); labelText.className = 'option-label'; labelText.textContent = v + ' — ' + labelsText[v-1]; label.appendChild(input); label.appendChild(radioWrap); label.appendChild(labelText); if(answers[q.id] && Number(answers[q.id]) === v){ label.classList.add('selected'); input.checked = true; } label.addEventListener('click', function(e){ Array.from(optionsDiv.querySelectorAll('.option')).forEach(opt => opt.classList.remove('selected')); label.classList.add('selected'); input.checked = true; answers[q.id] = Number(v); saveState(); nextBtn.disabled = false; }); optionsDiv.appendChild(label); } qArea.appendChild(optionsDiv); prevBtn.style.display = currentIndex === 0 ? 'none' : 'inline-block'; nextBtn.textContent = currentIndex === QUESTIONS.length - 1 ? 'Завершить' : 'Далее'; const sel = document.querySelector('input[name="q' + q.id + '"]:checked'); nextBtn.disabled = !sel; } prevBtn.addEventListener('click', function(){ if(currentIndex > 0) { currentIndex--; saveState(); renderQuestion(); } }); nextBtn.addEventListener('click', function(){ const q = QUESTIONS[currentIndex]; const selected = document.querySelector('input[name="q' + q.id + '"]:checked'); if(!selected) { alert('Пожалуйста, выберите вариант ответа, прежде чем продолжить.'); return; } answers[q.id] = Number(selected.value); if(currentIndex === QUESTIONS.length - 1) { saveState(); showResults(); return; } currentIndex++; saveState(); renderQuestion(); }); function computeAverages() { const sums = [0,0,0,0,0]; const counts = [0,0,0,0,0]; QUESTIONS.forEach(q => { const b = q.block - 1; const val = Number(answers[q.id] || 0); sums[b] += val; counts[b] += 1; }); const avgs = sums.map((s,i) => s / counts[i]); // средние в шкале 1..4 return avgs; } function showResults(){ surveyCard.style.display = 'none'; resultsCard.style.display = 'block'; const avgs = computeAverages(); const barColors = ['#4CC4FC', '#D870E8', '#F395B6', '#F5C657', '#1D062E']; renderChart(avgs, barColors); resultsText.innerHTML = avgs.map((a,i) => { return '<div style="padding:8px 0; border-bottom:1px solid rgba(33,33,33,0.04)"><strong>' + BLOCK_LABELS[i].replace('\\n',' ') + ':</strong> ' + a.toFixed(2) + ' (шкала 1–4)</div>'; }).join(''); } // Плагин для рисования чисел над столбцами (встроенный) const valueLabelPlugin = { id: 'valueLabelPlugin', afterDatasetsDraw(chart, args, options) { const {ctx} = chart; ctx.save(); ctx.font = '600 13px Jost, sans-serif'; ctx.fillStyle = '#212121'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; const dataset = chart.data.datasets[0]; const meta = chart.getDatasetMeta(0); meta.data.forEach((bar, index) => { const value = dataset.data[index]; const x = bar.x; const y = bar.y; const text = parseFloat(value).toFixed(2); const padding = 8; ctx.shadowColor = 'rgba(0,0,0,0.12)'; ctx.shadowBlur = 6; ctx.fillText(text, x, y - padding); ctx.shadowBlur = 0; }); ctx.restore(); } }; try { Chart.register && Chart.register(valueLabelPlugin); } catch(e){} function renderChart(values, colors){ const ctx = document.getElementById('resultsChart').getContext('2d'); if(chartInstance) { chartInstance.destroy(); chartInstance = null; } chartInstance = new Chart(ctx, { type: 'bar', data: { labels: BLOCK_LABELS.map(l => l.replace('\\n','\n')), datasets: [{ data: values.map(v => parseFloat(v.toFixed(2))), backgroundColor: colors, borderRadius: 12, borderSkipped: false }] }, options: { indexAxis: 'x', responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#212121', font: { family: 'Jost', size: 13 } }, grid: { display: false } }, y: { min: 1, max: 4, ticks: { stepSize: 1, color: '#212121', font: { family: 'Jost', size: 13 } }, title: { display: true, text: 'Шкала (1–4)', color: '#212121', font: { family: 'Jost', size: 12 } }, grid: { color: 'rgba(0,0,0,0.04)' } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) { return 'Средний: ' + context.parsed.y.toFixed(2) + ' (1–4)'; } } } } }, plugins: [valueLabelPlugin] }); } downloadBtn.addEventListener('click', function(){ if(!chartInstance) return; const url = chartInstance.toBase64Image(); const a = document.createElement('a'); a.href = url; a.download = 'results_chart.png'; a.click(); }); restartBtn.addEventListener('click', function(){ if(!confirm('Начать заново? Все ответы будут очищены.')) return; answers = {}; currentIndex = 0; localStorage.removeItem(STORAGE_KEY); resultsCard.style.display = 'none'; surveyCard.style.display = 'block'; renderQuestion(); }); loadState(); renderQuestion(); document.addEventListener('click', function(e){ const q = QUESTIONS[currentIndex]; if(!q) return; if(e.target.closest('.option')) { nextBtn.disabled = false; } }); documen
